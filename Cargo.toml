[package]
name = "pd2-save-sync"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
colored = "3.0"
anyhow = "1.0"
thiserror = "2.0"
notify = "8.0"
dirs = "6.0"

[dev-dependencies]
tempfile = "3.17"
